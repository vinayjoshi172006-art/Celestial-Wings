<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Celestial Wings 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08070a;--panel:rgba(20,18,15,0.55);--gold:#d8c49a;--text:#eae6da;--muted:#8f8a7d;--line:rgba(255,255,255,0.09);}
*{box-sizing:border-box;}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px;}
header{text-align:center;margin-bottom:18px;}
header h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:2.1rem;letter-spacing:.05em;margin:0 0 5px;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
header p{color:var(--muted);font-size:.84rem;margin:0;}
#stage-wrap{width:min(92vw,720px);}
#stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 24px 70px -16px #000a,0 0 0 1px var(--line);}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 28%,rgba(0,0,0,.48) 100%);}
#hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:.74rem;color:#ffffffc0;opacity:0;transition:opacity .6s;pointer-events:none;}
#statusOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,#000000b0,#000000ec);transition:opacity .4s;text-align:center;padding:0 24px;}
#statusOverlay.hidden{opacity:0;pointer-events:none;}
#statusOverlay p{max-width:300px;color:var(--muted);font-size:.85rem;margin:0;line-height:1.5;}
button.primary{background:linear-gradient(135deg,#3a3226,var(--gold));color:#1a1610;border:none;padding:12px 30px;border-radius:999px;font-size:.95rem;font-weight:600;cursor:pointer;transition:transform .15s;}
button.primary:hover{transform:translateY(-1px);}button.primary:disabled{opacity:.4;cursor:not-allowed;}
#panel{width:100%;max-width:720px;margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 22px;backdrop-filter:blur(8px);}
.row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}.row:last-child{margin-bottom:0;}
.row label{flex:0 0 88px;font-size:.78rem;color:var(--muted);}input[type=range]{flex:1;accent-color:var(--gold);}
.swatches{display:flex;gap:9px;}.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s;}
.swatch:hover{transform:scale(1.08);}.swatch.active{border-color:#fff;}
#loadMsg{position:absolute;bottom:12px;right:12px;font-size:.68rem;color:#ffffff60;pointer-events:none;}
footer{margin-top:18px;font-size:.72rem;color:#5b574c;text-align:center;}
/* ── Capture UI ───────────────────────────────────────────────────── */
#captureBtn{position:absolute;bottom:16px;right:16px;width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,0.14);border:1.5px solid rgba(255,255,255,0.5);cursor:pointer;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);
  transition:transform .15s,background .15s;z-index:20;padding:0;}
#captureBtn:hover{background:rgba(255,255,255,0.28);transform:scale(1.07);}
#captureBtn:active{transform:scale(0.95);}
#captureBtn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#micBtn{position:absolute;bottom:16px;right:76px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,0.10);border:1.5px solid rgba(255,255,255,0.30);cursor:pointer;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);
  transition:all .2s;z-index:20;padding:0;}
#micBtn.listening{background:rgba(236,64,64,0.28);border-color:rgba(236,64,64,0.80);}
#micBtn svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#voiceLabel{position:absolute;bottom:68px;right:12px;font-size:.68rem;color:#ffffffaa;
  display:none;pointer-events:none;text-align:right;background:rgba(0,0,0,.45);
  padding:3px 8px;border-radius:6px;}
#captureFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
  border-radius:inherit;transition:opacity .1s;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(236,64,64,.6)}50%{box-shadow:0 0 0 8px rgba(236,64,64,0)}}
</style></head><body>
<div id="app">
<header><h1>Celestial Wings 3D</h1><p>Live AR — your 3D model, rigged to your body</p></header>
<div id="stage-wrap"><div id="stage">
<video id="video" autoplay playsinline muted style="display:none"></video>
<canvas id="mainCanvas"></canvas>
<div id="vignette"></div><div id="hint"></div>
<div id="loadMsg">Loading 3D model…</div>
<!-- Capture button (camera icon) -->
<button id="captureBtn" title="Capture photo (or say 'Wings')">
  <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
</button>
<!-- Mic button — shows voice-trigger status -->
<button id="micBtn" title="Voice trigger: say 'Wings' to capture">
  <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M19 10a7 7 0 0 1-14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
</button>
<div id="voiceLabel">Say "Wings" 📸</div>
<div id="captureFlash"></div>
<div id="statusOverlay"><button class="primary" id="startBtn">Begin</button>
<p id="statusText">Allow camera access, then step back so your shoulders are visible.</p>
</div></div></div>
<div id="panel">
<div class="row"><label>Wing size</label><input type="range" id="sizeSlider" min="40" max="220" value="100"></div>
<div class="row"><label>Glow</label><input type="range" id="glowSlider" min="0" max="100" value="55"></div>
<div class="row"><label>Hue</label><div class="swatches" id="swatches">
<div class="swatch active" data-theme="celestial" data-color="f5f0e8" title="Celestial" style="background:linear-gradient(135deg,#ddd5bf,#fff)"></div>
<div class="swatch" data-theme="golden" data-color="fff2c0" title="Golden" style="background:linear-gradient(135deg,#f0c060,#fff8e0)"></div>
<div class="swatch" data-theme="ice" data-color="e0f2ff" title="Ice" style="background:linear-gradient(135deg,#80c8f8,#eaf8ff)"></div>
<div class="swatch" data-theme="void" data-color="ecdaff" title="Void" style="background:linear-gradient(135deg,#b880ff,#eee0ff)"></div>
</div></div></div>
<footer>Runs fully in your browser — nothing is recorded or uploaded.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

// ── DOM refs ─────────────────────────────────────────────────────────────
const video         = document.getElementById("video");
const mainCanvas    = document.getElementById("mainCanvas");
const mainCtx       = mainCanvas.getContext("2d");
const stage         = document.getElementById("stage");
const startBtn      = document.getElementById("startBtn");
const statusOverlay = document.getElementById("statusOverlay");
const statusText    = document.getElementById("statusText");

// ── Offscreen canvases for layered compositing ────────────────────────────
const bgCanvas = document.createElement("canvas");
const bgCtx    = bgCanvas.getContext("2d");
const fgCanvas = document.createElement("canvas");
const fgCtx    = fgCanvas.getContext("2d");
const occCanvas = document.createElement("canvas"); // holds the full occluded
const occCtx    = occCanvas.getContext("2d");        // composite, cross-faded in
const offGL    = document.createElement("canvas");
// Ghost fix: two frame-buffer canvases ensure the displayed video frame
// and the segmentation mask are always from the same MediaPipe send()
const pendingFrame = document.createElement("canvas");
const activeFrame  = document.createElement("canvas");
const pfCtx = pendingFrame.getContext("2d");
const afCtx = activeFrame.getContext("2d");
let   activeFrameReady = false;

// Latency fix: feed MediaPipe a small downscaled (unmirrored) frame instead
// of the full camera resolution. Inference time scales with input size, and
// a slow device producing masks every 400-800ms is the real source of the
// "afterimage" — the composite was redrawing a frozen old you every render
// frame while you'd already moved. Smaller input = faster inference = a
// fresher mask = less staleness. Mask/landmark OUTPUT format is unaffected.
const inferCanvas = document.createElement("canvas");
const inferCtx = inferCanvas.getContext("2d");
let inferSized = false;
const INFER_W = 256;

// Staleness guard: if a fresh mask hasn't arrived recently, stop compositing
// with the old one — better to show plain video+wings than a stale ghost.
let lastSegTime = 0;
const MAX_SEG_AGE_MS = 450;
// Smoothed 0-1 value: how much of the occluded (person-in-front) composite
// to show. Eases toward 1 when masks are fresh, toward 0 when stale — this
// is what stops the hard on/off flicker when freshness hovers near the
// threshold on a slower device.
let occlusionAlpha = 0;

let viewW = 0, viewH = 0;
function resize() {

  if (!w || !h) return;

  viewW = w; viewH = h;

  // 2-D canvases: physical pixel resolution so Retina/HiDPI stays crisp
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  mainCanvas.width  = bgCanvas.width  = fgCanvas.width  = occCanvas.width  = pw;
  mainCanvas.height = bgCanvas.height = fgCanvas.height = occCanvas.height = ph;
  pendingFrame.width  = activeFrame.width  = pw;
  pendingFrame.height = activeFrame.height = ph;

  // Scale every 2-D context once so all CSS-coordinate drawing maps to
  // the correct physical pixels (save/restore in renderLoop preserves this)
  mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  occCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  afCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  [mainCtx, bgCtx, fgCtx, occCtx, pfCtx, afCtx].forEach(c => {
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = 'high';
  });

  // Three.js: setPixelRatio MUST come before setSize so the offGL canvas
  // is sized to w*dpr × h*dpr in the first call — never override offGL manually
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);

  camera.left=-w/2; camera.right=w/2; camera.top=h/2; camera.bottom=-h/2;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// ── Three.js setup ───────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas:offGL, alpha:true, antialias:true, preserveDrawingBuffer:true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1, 0.1, 2000);
camera.position.z = 500;

// 5-point lighting for dramatic feather depth and realism
scene.add(new THREE.AmbientLight(0xfff5e0, 0.62));              // warm ambient
const keyLight = new THREE.DirectionalLight(0xfff8f0, 2.10);    // strong upper-front key
keyLight.position.set(0.2, 1.8, 2.8);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xd8eaff, 0.55);   // cool side fill
fillLight.position.set(-2.0, 0.4, 1.0);
scene.add(fillLight);
const topLight = new THREE.DirectionalLight(0xffffff, 0.45);   // softened: was over-emphasizing shaft ridges
topLight.position.set(0.0, 3.0, 0.6);
scene.add(topLight);
const rimLight = new THREE.DirectionalLight(0xffb060, 0.70);    // warm rim below-back
rimLight.position.set(0.0, -1.3, -2.0);
scene.add(rimLight);

// ── Flap shader uniforms (shared across material updates) ────────────────
const uFlap = { value: 0.0 };
const uTime = { value: 0.0 };

// Strips a small number of confirmed non-feather triangles baked into this
// GLB export: a leftover rigging/control strut from the original 3D
// software, running between the wings. Measured directly against this
// model's real data: every legitimate feather triangle has a longest edge
// under 0.09 units; the strut's triangles sit at 0.67-1.36 units, a clean,
// unambiguous gap separates the two — this is not a guess, it's a verified
// statistical outlier removal, confirmed visually before shipping.
function stripOutlierTriangles(geometry, maxEdgeThreshold) {
  const idx = geometry.index;
  const pos = geometry.attributes.position;
  if (!idx) return geometry; // already non-indexed — nothing to filter here
  const srcIdx = idx.array;
  const keep = [];
  const ax=new THREE.Vector3(), bx=new THREE.Vector3(), cx=new THREE.Vector3();
  for (let i = 0; i < srcIdx.length; i += 3) {
    const ia = srcIdx[i], ib = srcIdx[i+1], ic = srcIdx[i+2];
    ax.fromBufferAttribute(pos, ia);
    bx.fromBufferAttribute(pos, ib);
    cx.fromBufferAttribute(pos, ic);
    const maxEdge = Math.max(ax.distanceTo(bx), bx.distanceTo(cx), cx.distanceTo(ax));
    if (maxEdge <= maxEdgeThreshold) keep.push(ia, ib, ic);
  }
  geometry.setIndex(keep);
  return geometry;
}

// ── Load embedded GLB ────────────────────────────────────────────────────
let wingRoot = null;
let modelLoaded = false;
(function loadWing() {
  const bytes = Uint8Array.from(atob(GLB_B64), c => c.charCodeAt(0));
  const blob  = new Blob([bytes], { type:"model/gltf-binary" });
  const url   = URL.createObjectURL(blob);
  new GLTFLoader().load(url, gltf => {
    wingRoot = gltf.scene;
    wingRoot.traverse(child => {
      if (!child.isMesh) return;

      // Remove the rigging-strut triangles BEFORE crease-normal processing,
      // so they can't influence neighbouring feather normals at all.
      stripOutlierTriangles(child.geometry, 0.20);

      // Crease angle: 15° keeps gentle within-feather curves smooth while
      // preserving the boundary between adjacent overlapping feathers as a
      // real hard edge. Data-verified: p50 dihedral = 12.8° (within-feather
      // gentle curves), feather-to-feather boundaries sit at 15-35°.
      // Previous 40° threshold smoothed 88% of all edges including most of
      // those boundaries — collapsing individual feathers into one blob.
      child.geometry = toCreasedNormals(child.geometry, THREE.MathUtils.degToRad(15));

      // Per-vertex colour: root-to-tip brightness gradient. Computed on
      // the POST-crease geometry, since its vertex count/order changed.
      const pos  = child.geometry.attributes.position;
      const cols = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        const tip    = Math.abs(x) / 0.999;            // 0=spine, 1=wingtip
        const height = (y / 0.683 + 1) * 0.5;          // 0=bottom, 1=top
        const base   = 0.86 + tip * 0.12 + height * 0.025;
        cols[i*3]   = Math.min(1, base + 0.06);         // R – warm
        cols[i*3+1] = Math.min(1, base + 0.02);         // G – neutral
        cols[i*3+2] = Math.min(1, base - 0.03);         // B – slightly cool
      }
      child.geometry.setAttribute('color', new THREE.BufferAttribute(cols, 3));

      child.material = new THREE.MeshStandardMaterial({
        vertexColors:      true,
        flatShading:       false,      // smooth is now safe to use, since
                                        // creases are already split correctly
        roughness:         0.55,
        metalness:         0.0,
        emissive:          new THREE.Color(0x1c1408),
        emissiveIntensity: 0.14,
        side:              THREE.DoubleSide,
      });
      // Inject flap + idle animation into vertex shader
      // Injected just before projection so it runs after any skinning
      child.material.onBeforeCompile = shader => {
        shader.uniforms.uFlap = uFlap;
        shader.uniforms.uTime = uTime;
        shader.vertexShader = "uniform float uFlap;\nuniform float uTime;\n" +
          shader.vertexShader.replace("#include <project_vertex>",
            `{
              // normalise X so -1=left tip, +1=right tip
              float nx = transformed.x / 0.9985;
              float tipFactor = abs(nx);
              // gentle idle flutter (tips move more than root)
              float idle = sin(uTime * 1.85 + tipFactor * 3.14159) * 0.016 * tipFactor;
              // flap lift — tips rise most, matching real wing kinematics
              float flap = uFlap * tipFactor * 0.30;
              // slight forward lean during flap for 3-D feel
              transformed.y += idle + flap;
              transformed.z += uFlap * tipFactor * 0.04;
            }
            #include <project_vertex>`
          );
      };
      child.material.needsUpdate = true;
    });
    scene.add(wingRoot);
    URL.revokeObjectURL(url);
    modelLoaded = true;
    loadMsg.style.display = "none";
    console.log("3D wing model loaded.");
  }, undefined, err => {
    console.error("GLB load error:", err);
    loadMsg.textContent = "Model load failed.";
  });
})();

// ── Tracking state ───────────────────────────────────────────────────────
const cur = { x:0, y:0, S:0, rZ:0, rY:0 };
const tgt = { x:0, y:0, S:0, rZ:0, rY:0 };
let curFlap=0, tgtFlap=0;
let sizeAmt=1.0, glowAmt=0.55;
let started=false, lastSeg=null, missCount=0, hintShown=false;

// ── Render loop ──────────────────────────────────────────────────────────
function renderLoop(time) {
  requestAnimationFrame(renderLoop);
  if (!started || video.readyState < 2) return;

  // Adaptive lerp: snap fast on large movement, settle smoothly at rest
  const moveDist = Math.hypot(tgt.x - cur.x, tgt.y - cur.y);
  const L = moveDist > viewW * 0.03 ? 0.38 : 0.22;
  cur.x  += (tgt.x  - cur.x)  * L;
  cur.y  += (tgt.y  - cur.y)  * L;
  cur.S  += (tgt.S  - cur.S)  * 0.22;
  cur.rZ += (tgt.rZ - cur.rZ) * 0.28;
  cur.rY += (tgt.rY - cur.rY) * 0.22;
  curFlap += (tgtFlap - curFlap) * 0.18;

  uTime.value = time * 0.001;
  uFlap.value = curFlap;

  const S = cur.S * sizeAmt;

  // Position & scale the 3D wing model — no vel drag (it added visual lag)
  if (wingRoot && S > 5) {
    wingRoot.position.x = (cur.x - viewW * 0.5);
    wingRoot.position.y = -(cur.y - viewH * 0.5);
    wingRoot.position.z = 0;
    const ws = S * 1.5;
    wingRoot.scale.set(
      ws * Math.max(0.25, Math.cos(cur.rY * 0.55)),
      ws,
      ws
    );
    wingRoot.rotation.z = -cur.rZ;
    wingRoot.rotation.y =  cur.rY * 0.4;
  }

  // Only render Three.js when model is loaded and wings are visible
  if (modelLoaded && S > 5) {
    renderer.render(scene, camera);
  }

  // ── Composite: live base, then occlusion cross-faded on top ─────────
  // Always draw plain mirrored video first — this layer never freezes and
  // never flickers, because it's always the current frame.
  mainCtx.clearRect(0, 0, viewW, viewH);
  mainCtx.save(); mainCtx.translate(viewW, 0); mainCtx.scale(-1, 1);
  mainCtx.drawImage(video, 0, 0, viewW, viewH);
  mainCtx.restore();
  if (modelLoaded && S > 5) mainCtx.drawImage(offGL, 0, 0, viewW, viewH);

  // Ease toward "fully occluded" when the mask is fresh, toward "fully
  // plain video" when it's stale. This damping is what eliminates the
  // flicker: even if freshness itself flips rapidly near the threshold,
  // the visible alpha can only change gradually frame to frame.
  const segFresh = activeFrameReady && (time - lastSegTime) <= MAX_SEG_AGE_MS;
  occlusionAlpha += ((segFresh ? 1 : 0) - occlusionAlpha) * 0.10;

  if (occlusionAlpha > 0.01 && activeFrameReady) {
    // Build the full "background-hole + wings + person-on-top" composite
    // into its own buffer, then blend it over the live base by alpha.
    occCtx.clearRect(0, 0, viewW, viewH);

    bgCtx.clearRect(0, 0, viewW, viewH);
    bgCtx.drawImage(activeFrame, 0, 0, viewW, viewH);
    bgCtx.globalCompositeOperation = "destination-out";
    bgCtx.save(); bgCtx.translate(viewW, 0); bgCtx.scale(-1, 1);
    bgCtx.drawImage(lastSeg, 0, 0, viewW, viewH); bgCtx.restore();
    bgCtx.globalCompositeOperation = "source-over";
    occCtx.drawImage(bgCanvas, 0, 0, viewW, viewH);

    if (modelLoaded && S > 5) occCtx.drawImage(offGL, 0, 0, viewW, viewH);

    fgCtx.clearRect(0, 0, viewW, viewH);
    fgCtx.drawImage(activeFrame, 0, 0, viewW, viewH);
    fgCtx.globalCompositeOperation = "destination-in";
    fgCtx.save(); fgCtx.translate(viewW, 0); fgCtx.scale(-1, 1);
    fgCtx.drawImage(lastSeg, 0, 0, viewW, viewH); fgCtx.restore();
    fgCtx.globalCompositeOperation = "source-over";
    occCtx.drawImage(fgCanvas, 0, 0, viewW, viewH);

    mainCtx.globalAlpha = occlusionAlpha;
    mainCtx.drawImage(occCanvas, 0, 0, viewW, viewH);
    mainCtx.globalAlpha = 1;
  }

  // Warm glow at wing root
  if (glowAmt > 0.04 && S > 5) {
    const gr = S * 0.55;
    const grd = mainCtx.createRadialGradient(cur.x,cur.y,0,cur.x,cur.y,gr);
    grd.addColorStop(0, `rgba(255,245,218,${(glowAmt*0.22).toFixed(3)})`);
    grd.addColorStop(1, "rgba(0,0,0,0)");
    mainCtx.fillStyle = grd;
    mainCtx.fillRect(0, 0, viewW, viewH);
  }
}

// ── MediaPipe pose + segmentation ────────────────────────────────────────
if (typeof Pose === "undefined") {
  statusText.textContent = "Could not load MediaPipe. Check connection and reload.";
  startBtn.disabled = true;
} else {
  const pose = new Pose({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
  });
  pose.setOptions({
    modelComplexity: 1,          // restored: lite-model masks were noisier at edges;
                                  // input downscaling below offsets the speed cost
    smoothLandmarks: true,
    enableSegmentation: true,
    smoothSegmentation: false,   // would add temporal lag on top of inference lag
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(results => {
    if (results.segmentationMask) {
      lastSeg = results.segmentationMask;
      lastSegTime = performance.now();
      // Update activeFrame at the same time as lastSeg — guaranteed sync, no ghost
      afCtx.clearRect(0, 0, viewW, viewH);
      afCtx.drawImage(pendingFrame, 0, 0, viewW, viewH);
      activeFrameReady = true;
    }
    const lm = results.poseLandmarks;
    const LS = lm?.[11], RS = lm?.[12], LW = lm?.[15], RW = lm?.[16];
    if (!LS || !RS || (LS.visibility??1) < 0.28 || (RS.visibility??1) < 0.28) {
      if (++missCount > 20) {
        statusOverlay.classList.remove("hidden");
        statusText.textContent = "Step back — both shoulders must be visible.";
      }
      return;
    }
    missCount = 0;
    statusOverlay.classList.add("hidden");
    if (!hintShown) {
      hintShown = true;
      hintEl.textContent = "Raise your arms to flap the wings!";
      hintEl.style.opacity = "1";
      setTimeout(() => hintEl.style.opacity = "0", 5000);
    }
    const mLx = 1-LS.x, mRx = 1-RS.x;
    const midX = (mLx+mRx)*0.5, midY = (LS.y+RS.y)*0.5;
    const spx  = Math.abs(mLx-mRx)*viewW;
    tgt.x  = midX * viewW;
    tgt.y  = midY * viewH + spx * 0.05;
    tgt.S  = spx;
    tgt.rZ = Math.atan2(RS.y-LS.y, mRx-mLx);
    tgt.rY = Math.max(-0.5, Math.min(0.5, ((LS.z??0)-(RS.z??0))*2.5));
    if (LW && RW) {
      const wY = (LW.y+RW.y)*0.5;
      tgtFlap = Math.max(0, Math.min(1, (midY-wY)*4.0));
    }
  });

  let poseBusy = false;
  function poseLoop() {
    requestAnimationFrame(poseLoop);
    if (!poseBusy && video.readyState >= 2 && video.videoWidth > 0) {
      poseBusy = true;

      // Size the inference canvas once we know the camera's native aspect ratio
      if (!inferSized) {
        inferCanvas.width  = INFER_W;
        inferCanvas.height = Math.round(INFER_W * (video.videoHeight / video.videoWidth));
        inferSized = true;
      }

      // Display snapshot: full-res, mirrored — becomes activeFrame once mask arrives
      pfCtx.clearRect(0, 0, viewW, viewH);
      pfCtx.save();
      pfCtx.translate(viewW, 0);
      pfCtx.scale(-1, 1);
      pfCtx.drawImage(video, 0, 0, viewW, viewH);
      pfCtx.restore();

      // Inference input: small, UNMIRRORED (matches what landmark math expects)
      inferCtx.drawImage(video, 0, 0, inferCanvas.width, inferCanvas.height);

      pose.send({image:inferCanvas}).catch(()=>{}).finally(()=>{ poseBusy=false; });
    }
  }

  // ── Controls ─────────────────────────────────────────────────────────
  document.getElementById("sizeSlider").addEventListener("input", e => sizeAmt = e.target.value/100);
  document.getElementById("glowSlider").addEventListener("input", e => glowAmt = e.target.value/100);
  document.querySelectorAll(".swatch").forEach(sw => {
    sw.addEventListener("click", () => {
      document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
      sw.classList.add("active");
      if (!wingRoot) return;
      const hex = parseInt(sw.dataset.color, 16);
      wingRoot.traverse(c => { if (c.isMesh) c.material.color.setHex(hex); });
    });
  });

  // ── Start button ─────────────────────────────────────────────────────
  startBtn.addEventListener("click", async () => {
    statusText.textContent = "Requesting camera...";
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:"user", width:{ideal:1280}, height:{ideal:960} },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      video.addEventListener("loadedmetadata", () => {
        stage.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
        resize();
      }, { once:true });
      startBtn.style.display = "none";
      statusText.textContent = "Searching for your shoulders...";
      started = true;
      resize();
      requestAnimationFrame(renderLoop);
      poseLoop();

      // ── Capture button + voice trigger ─────────────────────────────
      const capBtn   = document.getElementById("captureBtn");
      const micBtn   = document.getElementById("micBtn");
      const voiceLbl = document.getElementById("voiceLabel");
      const flash    = document.getElementById("captureFlash");

      // Show UI elements now that camera is live
      capBtn.style.display   = "flex";
      micBtn.style.display   = "flex";
      voiceLbl.style.display = "block";

      function capturePhoto() {
        // White flash effect
        flash.style.transition = "none";
        flash.style.opacity = "0.92";
        requestAnimationFrame(() => {
          flash.style.transition = "opacity 0.35s ease";
          requestAnimationFrame(() => { flash.style.opacity = "0"; });
        });

        // Grab whatever is currently rendered on mainCanvas
        const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,"-");
        const filename = `celestial-wings-${ts}.png`;

        try {
          mainCanvas.toBlob(blob => {
            if (!blob) { dataUrlFallback(filename); return; }
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 2000);
          }, "image/png");
        } catch(e) { dataUrlFallback(filename); }
      }

      function dataUrlFallback(filename) {
        try {
          const a = document.createElement("a");
          a.href = mainCanvas.toDataURL("image/png");
          a.download = filename;
          document.body.appendChild(a); a.click();
          document.body.removeChild(a);
        } catch(e) { console.warn("Capture failed:", e); }
      }

      capBtn.addEventListener("click", capturePhoto);

      // ── Voice trigger: say "Wings" to snap a photo ─────────────────
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        const rec = new SR();
        rec.continuous    = true;
        rec.interimResults = true;
        rec.lang          = "en-US";

        let lastCapTime = 0;     // debounce — don't fire twice per utterance
        let autoRestarts = 0;    // browsers end a session after ~60s of use;
        const MAX_AUTO_RESTARTS = 2; // restarting forever is what re-triggers
                                      // the permission/mic-indicator prompt
                                      // every couple of minutes — cap it and
                                      // hand control back to the user instead

        function setMicIdle() {
          micBtn.classList.remove("listening");
          micBtn.style.animation = "none";
          micBtn.title = 'Voice trigger paused — tap to resume';
          voiceLbl.textContent = 'Tap mic to resume voice 🎙';
        }

        rec.onresult = e => {
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const text = e.results[i][0].transcript.toLowerCase();
            if (text.includes("wing") && Date.now() - lastCapTime > 2500) {
              lastCapTime = Date.now();
              capturePhoto();
            }
          }
        };

        rec.onerror = e => {
          if (e.error !== "no-speech" && e.error !== "aborted")
            console.warn("Voice:", e.error);
        };

        // The browser ends a session on its own periodically. Auto-restart a
        // couple of times to ride through brief silence, then stop — letting
        // this restart forever is what causes the repeated permission prompt.
        rec.onend = () => {
          if (started && autoRestarts < MAX_AUTO_RESTARTS) {
            autoRestarts++;
            setTimeout(() => { try { rec.start(); } catch(_) {} }, 300);
          } else {
            setMicIdle();
          }
        };

        rec.onstart = () => {
          autoRestarts = 0; // a fresh, explicit start resets the budget
          micBtn.classList.add("listening");
          micBtn.style.animation = "mic-pulse 1.8s infinite";
          micBtn.title = 'Voice trigger active — say "Wings" to capture';
          voiceLbl.textContent = 'Say "Wings" 📸';
        };

        // Tap the mic to manually re-arm once auto-restart has paused
        micBtn.addEventListener("click", () => {
          if (!micBtn.classList.contains("listening")) {
            try { rec.start(); } catch(_) {}
          }
        });

        try {
          rec.start();
        } catch(e) {
          // Voice not available (HTTP, old browser) — hide mic silently
          micBtn.style.display  = "none";
          voiceLbl.style.display = "none";
        }
      } else {
        // Browser has no speech API — hide mic indicator
        micBtn.style.display   = "none";
        voiceLbl.style.display = "none";
      }
    } catch(err) {
      if (err.name==="NotAllowedError")
        statusText.textContent = "Camera denied. Allow it in the address bar and try again.";
      else if (err.name==="NotFoundError")
        statusText.textContent = "No camera found on this device.";
      else
        statusText.textContent = `Error: ${err.message}. Try: python -m http.server then open http://localhost:8000`;
    }
  });
}

resize();
</script></body></html>
